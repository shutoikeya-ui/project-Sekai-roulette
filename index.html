

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>プロセカ譜面ルーレット</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 24px 14px;

  background: #10121c;

  color: white;

  font-family: system-ui, sans-serif;

}

main {

  max-width: 560px;

  margin: auto;

}

h1 {

  text-align: center;

  font-size: 25px;

}

.sub {

  text-align: center;

  color: #aeb4c9;

  font-size: 13px;

}

.panel {

  background: #202437;

  border-radius: 16px;

  padding: 18px;

  margin: 18px 0;

}

.rate {

  display: flex;

  justify-content: space-between;

  margin: 12px 0 5px;

}

.bar {

  height: 9px;

  background: #41465b;

  border-radius: 10px;

  overflow: hidden;

}

.fill { height: 100%; }

.ex { background: #43a9ed; width: 40%; }

.ma { background: #b18aff; width: 50%; }

.ap { background: #45c99a; width: 10%; }

button {

  width: 100%;

  padding: 17px;

  border: none;

  border-radius: 13px;

  background: #6879ee;

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 12px;

}

button:active { transform: scale(.98); }

.result {

  background: #292f45;

  padding: 17px;

  border-radius: 14px;

  margin: 12px 0;

  animation: appear .3s ease;

}

@keyframes appear {

  from { opacity: 0; transform: translateY(8px); }

  to { opacity: 1; transform: translateY(0); }

}

.tag {

  display: inline-block;

  padding: 5px 11px;

  border-radius: 20px;

  font-size: 12px;

  font-weight: bold;

}

.EXPERT { background: #246b9b; }

.MASTER { background: #694c9e; }

.APPEND { background: #207b60; }

.song { font-size: 19px; font-weight: bold; margin: 14px 0; }

.level { font-size: 28px; font-weight: bold; }

small { color: #aeb4c9; }

</style>

</head>

<body>

<main>

<h1>🎵 プロセカ譜面ルーレット</h1>

<p class="sub">EXPERT / MASTER / APPEND<br>LEVEL 29〜38</p>

<div class="panel">

  <h3>難易度出現確率</h3>

  <div class="rate"><span>EXPERT</span><b>40%</b></div>

  <div class="bar"><div class="fill ex"></div></div>

  <div class="rate"><span>MASTER</span><b>50%</b></div>

  <div class="bar"><div class="fill ma"></div></div>

  <div class="rate"><span>APPEND</span><b>10%</b></div>

  <div class="bar"><div class="fill ap"></div></div>

  <small>難易度 → レベル → 曲 の順番で抽選</small>

</div>

<div id="results">

  <div class="panel" style="text-align:center">

    抽選ボタンを押してスタート！

  </div>

</div>

<button onclick="lottery()">🎲 3曲をランダム抽選</button>

<p class="sub" id="count">抽選回数：0回</p>

</main>

<script>

// 曲データ

// [曲名, 難易度, レベル]

const songs = [

["六兆年と一夜物語","EXPERT",29],

["初音ミクの消失","EXPERT",30],

["初音ミクの激唱","EXPERT",30],

["Don't Fight The Music","EXPERT",30],

["エンドマークに希望と涙を添えて","EXPERT",31],

["the EmpErroR","EXPERT",31],

["ヤミナベ!!!!","EXPERT",31],

["マシンガンポエムドール","EXPERT",31],

["ODDS&ENDS","MASTER",29],

["ニジイロストーリーズ","MASTER",29],

["ロウワー","MASTER",31],

["テオ","MASTER",32],

["六兆年と一夜物語","MASTER",34],

["メモリア","MASTER",34],

["エンドマークに希望と涙を添えて","MASTER",35],

["初音ミクの消失","MASTER",35],

["Don't Fight The Music","MASTER",36],

["the EmpErroR","MASTER",36],

["What's up? Pop!","MASTER",37],

["ヤミナベ!!!!","MASTER",37],

["ワーワーワールド","APPEND",29],

["ハッピーシンセサイザ","APPEND",29],

["青く駆けろ！","APPEND",30],

["劣等上等","APPEND",30],

["モア！ジャンプ！モア！","APPEND",30],

["ビバハピ","APPEND",31],

["ステラ","APPEND",31],

["トンデモワンダーズ","APPEND",32],

["Iなんです","APPEND",32],

["NEO","APPEND",32],

["ヒバナ -Reloaded-","APPEND",34],

["Brand New Day","APPEND",35],

["folern","APPEND",35],

["Sage","APPEND",36],

["MarbleBlue.","APPEND",37]

];

let count = 0;

function weightedDifficulty() {

  const r = Math.random() * 100;

  if (r < 40) return "EXPERT";

  if (r < 90) return "MASTER";

  return "APPEND";

}

function lottery() {

  let pool = [...songs];

  let selected = [];

  for (let i = 0; i < 3; i++) {

    // 抽選可能な難易度だけを対象にする

    let available = ["EXPERT","MASTER","APPEND"]

      .filter(d => pool.some(s => s[1] === d));

    let difficulty = weightedDifficulty();

    // その難易度に曲がなければ再抽選

    while (!available.includes(difficulty)) {

      difficulty = weightedDifficulty();

    }

    // その難易度に存在するレベルから抽選

    let levels = [...new Set(

      pool.filter(s => s[1] === difficulty).map(s => s[2])

    )];

    let level = levels[Math.floor(Math.random() * levels.length)];

    // 条件に合う曲を抽選

    let candidates = pool.filter(

      s => s[1] === difficulty && s[2] === level

    );

    let song = candidates[Math.floor(Math.random() * candidates.length)];

    selected.push(song);

    // 同じ曲名の重複を防止

    pool = pool.filter(s => s[0] !== song[0]);

  }

  count++;

  document.getElementById("count").textContent =

    `抽選回数：${count}回`;

  document.getElementById("results").innerHTML =

    selected.map((s,i) => `

      <div class="result">

        <small>CHALLENGE ${i+1}</small><br><br>

        <span class="tag ${s[1]}">${s[1]}</span>

        <div class="song">${s[0]}</div>

        <div class="level">Lv.${s[2]}</div>

      </div>

    `).join("");

}

</script>

</body>

</html>
